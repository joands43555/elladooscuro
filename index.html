<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Exclusivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      text-align: center;
      max-width: 380px;
      width: 100%;
      background: #111;
      border-radius: 24px;
      padding: 55px 28px;
      border: 1px solid #1a1a1a;
    }
    .crown { font-size: 56px; margin-bottom: 16px; }
    .brand {
      color: #ff0050;
      font-weight: bold;
      letter-spacing: 4px;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 32px;
      margin: 6px 0 8px 0;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .sub {
      color: #777;
      margin-bottom: 35px;
      font-size: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #ff0050;
      color: white;
      text-decoration: none;
      padding: 18px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: all 0.25s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn:hover { background: #e60047; transform: scale(1.02); }
    .btn:active { transform: scale(0.97); }
    .disclaimer {
      margin-top: 18px;
      color: #444;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="crown">👑</div>
    <p class="brand">El Lado Oscuro</p>
    <h1>CANAL EXCLUSIVO</h1>
    <p class="sub">Un dios generoso</p>
    <a href="go.html" class="btn">✈️ ENTRAR AL CANAL</a>
    <p class="disclaimer">Contenido +18 · al entrar confirmas ser mayor de edad</p>
  </div>
</body>
</html>
